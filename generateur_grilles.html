<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Générateur de grilles — Calcul mental CE1</title>
<style>
:root {
  --navy: #14315C;
  --blue: #1F6FE0;
  --bg-page: #FBFBFE;
  --red: #C00000;
  --green: #1F8A3C;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --navy: #DCE6F5; --blue: #6EA8F5; --bg-page: #14171C; }
}
:root[data-theme="dark"] { --navy: #DCE6F5; --blue: #6EA8F5; --bg-page: #14171C; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: "Times New Roman", Georgia, serif;
  background: var(--bg-page);
  color: #111;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { color: #eee; } }
:root[data-theme="dark"] body { color: #eee; }
.controls {
  font-family: Arial, sans-serif;
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: flex-end;
}
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.field select, .field input[type=number] {
  font-family: Arial, sans-serif;
  font-size: 14px;
  padding: 6px 8px;
  border: 1px solid #999;
  border-radius: 6px;
  background: white;
  color: #111;
}
button {
  font-family: Arial, sans-serif;
  font-size: 14px;
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid var(--blue);
  background: var(--blue);
  color: white;
  cursor: pointer;
}
button.secondary { background: white; color: var(--blue); }
button.verify { background: var(--green); border-color: var(--green); }
.score {
  font-family: Arial, sans-serif;
  font-size: 15px;
  font-weight: bold;
  max-width: 900px;
  margin: 0 auto;
  padding: 0 16px;
  min-height: 24px;
}
.sheet { max-width: 900px; margin: 0 auto; padding: 16px; }
table.head { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
table.head td { border: 2px solid #000; padding: 8px 12px; font-weight: bold; font-size: 16px; color: #111; }
.titre { text-align: center; font-weight: bold; font-size: 20px; color: var(--navy); padding: 6px; border: 2px solid #000; border-top: none; }
.objectif { text-align: center; font-size: 13px; margin: 4px 0 10px; }
.code-fiche { text-align: right; font-family: Arial, sans-serif; font-size: 11px; color: #555; margin: 3px 2px 0; }
.section-title { text-align: center; font-weight: bold; font-size: 15px; color: var(--navy); margin: 22px 0 6px; }
table.grid { width: 100%; border-collapse: collapse; margin-bottom: 5px; table-layout: fixed; }
table.grid td { border: 1px solid #000; padding: 0 4px; text-align: center; font-size: 16px; color: #111; height: 1.05cm; }
.ans {
  font-family: "Times New Roman", Georgia, serif;
  font-size: 16px;
  width: 3.2em;
  text-align: center;
  border: none;
  border-bottom: 1.5px solid #333;
  background: transparent;
  color: inherit;
  padding: 2px 0;
}
.ans:focus { outline: 1px solid var(--blue); }
.ans.correct { color: var(--green); font-weight: bold; border-bottom-color: var(--green); }
.ans.wrong { color: var(--red); font-weight: bold; border-bottom-color: var(--red); background: rgba(192,0,0,0.08); }
.corrige-blank { font-weight: bold; }
.mini-chrono { font-family: Arial, sans-serif; font-weight: bold; font-size: 13px; color: var(--blue); margin-left: 8px; }
.mini-chrono.overtime { color: var(--green); }
.mini-chrono.pending { color: #999; }
.mini-btn {
  font-family: Arial, sans-serif;
  font-size: 11px;
  padding: 2px 8px;
  margin-left: 6px;
  border-radius: 10px;
  border: 1px solid var(--blue);
  background: var(--blue);
  color: white;
  cursor: pointer;
}
.mini-btn.secondary { background: white; color: var(--blue); }
.mini-score { font-family: Arial, sans-serif; font-weight: bold; font-size: 13px; margin-left: 8px; color: var(--navy); }
.niv-acquis { color: var(--green); }
.niv-encours { color: #B45F06; }
.niv-non { color: var(--red); }
.niv-fluence-tag { font-weight: normal; color: #555; }
@media print { .mini-btn, .mini-score { display: none; } }
@media print { .mini-chrono { display: none; } }
.temps { display: none; font-weight: normal; }
.no-chrono .mini-chrono, .no-chrono .mini-btn[data-role="start"], .no-chrono .mini-btn[data-role="stop"] { display: none; }
@media print { .chrono-on .temps { display: inline; } }
@media print {
  .controls, .score { display: none; }
  .sheet { max-width: none; padding: 6px; }
  body { background: white; color: #000; }
  .ans { border-bottom: 1px solid #333; }
  @page { size: A4 portrait; margin: 8mm; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="controls">
  <div class="field">
    <label>Type de fiche</label>
    <select id="type">
      <option value="table_stricte">Table stricte (sans/avec passage + mélange)</option>
      <option value="terme_manquant">Terme manquant</option>
      <option value="soustraction_associee">Soustraction associée</option>
      <option value="defi_vitesse_add">Défi vitesse — additions uniquement</option>
      <option value="defi_vitesse_sub">Défi vitesse — soustractions uniquement</option>
      <option value="defi_vitesse">Défi vitesse (3 manches de 18, mélangé)</option>
      <option value="bloc_unique_add">Bloc unique — additions uniquement</option>
      <option value="bloc_unique_sub">Bloc unique — soustractions uniquement</option>
      <option value="bloc_unique">Bloc unique mélangé (40, type micetf)</option>
      <option value="doubles">Doubles (bloc unique, jusqu'à N)</option>
      <option value="presque_doubles">Presque-doubles (bloc unique, jusqu'à N)</option>
      <option value="defi_vitesse_doubles">Défi vitesse — doubles (3 manches de 18, jusqu'à N)</option>
      <option value="defi_vitesse_presque_doubles">Défi vitesse — presque-doubles (3 manches de 18, jusqu'à N)</option>
      <option value="complement_10">Compléments à 10 (7 + … = 10)</option>
      <option value="complement_dizaine">Complément à la dizaine supérieure (65 + … = 70 ; 70 = 65 + …)</option>
      <option value="passage_dizaine">Passer la dizaine (38 + 5 = 40 + … puis 38 + 5 = …)</option>
      <option value="complement_passage">Complément avec passage de la dizaine (94 = 87 + …)</option>
      <option value="sommes_differences_passage">Sommes et différences avec passage de la dizaine (79 + 7 ; 23 − 6)</option>
      <option value="complement_dizaine_quelconque">Complément à une dizaine quelconque (30 = 6 + … ; 80 = 7 + …)</option>
      <option value="complement_50_100">Compléments à 50 et à 100 (50 = 35 + … ; 100 = 64 + …)</option>
      <option value="defi_vitesse_complement_10">Défi vitesse — compléments à 10 (3 manches de 18)</option>
      <option value="dizaines_centaines">Ajouter, soustraire des dizaines et des centaines entières (234 + 60 ; 765 − 200)</option>
      <option value="plus_9_19_29">Ajouter 9, 19, 29 et soustraire 9 (47 + 19 ; 64 − 9)</option>
      <option value="moities">Moitiés (bloc unique, nombres pairs jusqu'à N)</option>
      <option value="defi_vitesse_moities">Défi vitesse — moitiés (3 manches de 18, jusqu'à N)</option>
      <option value="doubles_moities">Doubles et moitiés mélangés (double de 7 ; moitié de 14, jusqu'à N)</option>
      <option value="doubles_moities_etendus">Doubles et moitiés étendus (double de 35 ; moitié de 80 ; moitié de 600)</option>
      <option value="fois_10">Multiplier par 10 (72 × 10)</option>
      <option value="multiples_25">Multiples de 25 jusqu’à 100 (3 × 25 ; 100 = … × 25)</option>
      <option value="distributivite">Produit par distributivité (13 × 7 = 70 + …)</option>
      <option value="mult_bloc_unique">Table de multiplication (bloc unique, de 0 à 10)</option>
      <option value="defi_vitesse_mult">Défi vitesse — table de multiplication (3 manches de 18, de 0 à 10)</option>
    </select>
  </div>
  <div class="field">
    <label id="labelN">Table / N</label>
    <input type="number" id="tableN" value="2" min="1" max="100" style="width:70px">
  </div>
  <div class="field" id="maxWrap" style="display:none">
    <label>Nombres jusqu'à</label>
    <select id="maxNb"><option value="99">99</option><option value="999">999</option></select>
  </div>
  <div class="field">
    <label><input type="checkbox" id="chrono" checked> Chrono (temps imparti imprimé à côté de chaque bloc)</label>
    <label><input type="checkbox" id="corrige"> Afficher le corrigé (au lieu de la saisie)</label>
  </div>
  <button id="btnGen">Générer une nouvelle grille</button>
  <button id="btnJour" class="secondary" title="Même grille pour tout le monde aujourd'hui (même type, même N)">Grille du jour</button>
  <div class="field">
    <label>Code fiche</label>
    <span style="display:flex;gap:4px"><input type="text" id="codeIn" placeholder="ex. TM5-48213" style="width:120px;font-family:Arial,sans-serif;font-size:14px;padding:6px 8px;border:1px solid #999;border-radius:6px"><button id="btnCode" class="secondary" type="button">Retrouver</button></span>
  </div>
  <button id="btnPrint" class="secondary">Imprimer</button>
  <button id="btnDownload" class="secondary">Télécharger la grille (HTML)</button>
  <button id="btnDownloadPdf" class="secondary">Télécharger en PDF</button>
  <button id="btnChronoReset" type="button" class="secondary">Réinitialiser les chronos</button>
</div>

<div class="sheet" id="sheet"></div>

<script>
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function selectDispersed(rng, values, count) {
  const pool = shuffle(rng, values);
  const n = pool.length;
  if (n >= count) return pool.slice(0, count);
  const base = Math.floor(count / n);
  const rem = count % n;
  const order = shuffle(rng, pool.map((_, i) => i));
  const bonus = new Set(order.slice(0, rem));
  const groups = pool.map((v, i) => Array(base + (bonus.has(i) ? 1 : 0)).fill(v));
  const result = [];
  let remaining = groups.reduce((s, g) => s + g.length, 0);
  const cursors = groups.map(() => 0);
  while (remaining > 0) {
    for (let gi = 0; gi < groups.length && remaining > 0; gi++) {
      if (cursors[gi] < groups[gi].length) {
        result.push(groups[gi][cursors[gi]]);
        cursors[gi]++;
        remaining--;
      }
    }
  }
  return result;
}
const DIZAINES = [10, 20, 30, 40, 50, 60, 70, 80, 90];
let BIG = false;   // option « nombres jusqu'à 999 » (champ numérique du CE1)
const TENS999 = []; for (let d = 10; d <= 980; d += 10) TENS999.push(d);
function big(list) { return BIG ? list.flatMap(d => [100, 200, 300, 400, 500, 600, 700, 800, 900].map(c => c + d)).filter(x => x <= 980) : list; }
function buildCombos(rng, units, dizaines, N) {
  const combos = [], lim = BIG ? 999 : 99;
  for (const u of units) for (const d of dizaines) if (!N || d + u + N <= lim) combos.push({ unit: u, dizaine: d });   // résultats et nombres de départ ≤ 99 (ou ≤ 999)
  return shuffle(rng, combos);
}
function selectDispersedCombos(rng, units, count, N) {
  const combos = buildCombos(rng, units, BIG ? TENS999 : DIZAINES, N);
  const n = combos.length;
  if (n >= count) return combos.slice(0, count);
  const base = Math.floor(count / n);
  const rem = count % n;
  const order = shuffle(rng, combos.map((_, i) => i));
  const bonus = new Set(order.slice(0, rem));
  const groups = combos.map((c, i) => Array(base + (bonus.has(i) ? 1 : 0)).fill(c));
  const result = [];
  let remaining = groups.reduce((s, g) => s + g.length, 0);
  const cursors = groups.map(() => 0);
  while (remaining > 0) {
    for (let gi = 0; gi < groups.length && remaining > 0; gi++) {
      if (cursors[gi] < groups[gi].length) {
        result.push(groups[gi][cursors[gi]]);
        cursors[gi]++;
        remaining--;
      }
    }
  }
  return result;
}
function unitsSansPassage(n) { const out = []; for (let u = 0; u <= 9; u++) if (u + n < 10) out.push(u); return out; }
function unitsAvecPassage(n) { const out = []; for (let u = 0; u <= 9; u++) if (u + n >= 10) out.push(u); return out; }

async function saveFile(filename, data, mimeType) {
  const hasClaudeRuntime = (typeof claude !== 'undefined') && claude && typeof claude.use === 'function';
  if (hasClaudeRuntime) {
    const downloads = await claude.use('downloads');
    if (downloads) {
      await downloads.save({ filename: filename, data: data });
      return 'claude';
    }
  }
  const blob = (data instanceof Blob) ? data : new Blob([data], { type: mimeType || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  return 'browser';
}

function renderHead(objectif) {
  return '<table class="head"><tr><td style="width:50%">Prénom : </td><td style="width:50%">Date : </td></tr></table>' +
    '<div class="titre">CALCUL MENTAL</div>' +
    '<div class="objectif">' + objectif + '</div>';
}
function renderGrid(items, cols, showCorrige, sectionId, sectionIdx) {
  let html = '<table class="grid">';
  const rows = Math.ceil(items.length / cols);
  for (let r = 0; r < rows; r++) {
    html += '<tr>';
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      const it = items[idx];
      if (!it) { html += '<td></td>'; continue; }
      if (showCorrige) {
        html += '<td>' + it.prefix + '<span class="corrige-blank">' + it.answer + '</span>' + it.suffix + '</td>';
      } else {
        const inputId = 'inp_' + sectionId + '_' + idx;
        html += '<td>' + it.prefix +
          '<input type="text" inputmode="numeric" autocomplete="off" class="ans" id="' + inputId + '" data-section="' + sectionIdx + '" data-answer="' + it.answer + '">' +
          it.suffix + '</td>';
      }
    }
    html += '</tr>';
  }
  html += '</table>';
  return html;
}

function makeItemStrict(rng, unit, dizaine, N) {
  const a = dizaine + unit;
  const sum = a + N;
  if (rng() < 0.5) return { prefix: a + ' + ' + N + ' = ', suffix: '', answer: String(sum) };
  return { prefix: N + ' + ' + a + ' = ', suffix: '', answer: String(sum) };
}
function makeItemTermeManquant(rng, unit, dizaine, N) {
  const a = dizaine + unit;
  const sum = a + N;
  if (rng() < 0.5) return { prefix: '', suffix: ' + ' + N + ' = ' + sum, answer: String(a) };
  return { prefix: N + ' + ', suffix: ' = ' + sum, answer: String(a) };
}
function makeItemSoustraction(rng, unit, dizaine, N) {
  const a = dizaine + unit;
  const s = a + N;
  return { prefix: s + ' \u2212 ' + N + ' = ', suffix: '', answer: String(a) };
}

function genSection(rng, units, count, N, maker) {
  const combos = selectDispersedCombos(rng, units, count, N);
  return combos.map(c => maker(rng, c.unit, c.dizaine, N));
}

function buildTripleBlock(N, seed, maker, objectifLabel) {
  const rng = mulberry32(seed);
  const itemsSans = genSection(rng, unitsSansPassage(N), 20, N, maker);
  const itemsAvec = genSection(rng, unitsAvecPassage(N), 20, N, maker);
  const allUnits = [...unitsSansPassage(N), ...unitsAvecPassage(N)];
  const itemsMelange = genSection(rng, allUnits, 32, N, maker);
  return { itemsSans, itemsAvec, itemsMelange, objectifLabel };
}

const SEC_PER_ITEM_ADD = 4.5;
const SEC_PER_ITEM_SUB = 6; // ajust\u00e9 empiriquement (ratio ~1.3 observ\u00e9 sur Ex8/Ex16 national, \u00e0 affiner sur l'ann\u00e9e)
function sectionDuration(nItems, secPerItem) {
  const sec = secPerItem || SEC_PER_ITEM_ADD;
  return Math.max(30, Math.round(nItems * sec / 30) * 30);
}
function formatMMSS(totalSec) {
  const s = Math.max(0, totalSec);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}
function formatTemps(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m ? m + ' min' + (s ? ' ' + String(s).padStart(2, '0') : '') : s + ' s'; }
function sectionControlsHtml(title, idx, duration) {
  const titlePart = title ? title + ' ' : '';
  return '<div class="section-title">' + titlePart + '<span class="temps">(' + formatTemps(duration) + ')</span> ' +
    '<span class="mini-chrono" id="chrono_' + idx + '">' + formatMMSS(duration) + '</span>' +
    ' <button type="button" class="mini-btn" data-role="start" data-idx="' + idx + '">\u25b6 D\u00e9marrer</button>' +
    ' <button type="button" class="mini-btn secondary" data-role="stop" data-idx="' + idx + '">\u23f9 Arr\u00eat</button>' +
    ' <button type="button" class="mini-btn secondary" data-role="verify" data-idx="' + idx + '">\u2713 V\u00e9rifier</button>' +
    ' <span class="mini-score" id="score_' + idx + '"></span>' +
    '</div>';
}

function renderTriplePage(N, block, sansLabel, avecLabel, showCorrige, secPerItem) {
  const dSans = sectionDuration(block.itemsSans.length, secPerItem);
  const dAvec = sectionDuration(block.itemsAvec.length, secPerItem);
  const dMel = sectionDuration(block.itemsMelange.length, secPerItem);
  let html = renderHead('OBJECTIF : ' + block.objectifLabel + ' ' + N + '.');
  html += sectionControlsHtml(sansLabel, 0, dSans);
  html += renderGrid(block.itemsSans, 4, showCorrige, 's1', 0);
  html += sectionControlsHtml(avecLabel, 1, dAvec);
  html += renderGrid(block.itemsAvec, 4, showCorrige, 's2', 1);
  html += sectionControlsHtml('M\u00e9lange', 2, dMel);
  html += renderGrid(block.itemsMelange, 4, showCorrige, 's3', 2);
  return html;
}

function genDefiVitesse(N, seed, op) {
  const rng = mulberry32(seed);
  const nums = [];
  if (op === 'add') { for (let i = 0; i <= 89 - N; i++) nums.push(i); }
  else if (op === 'sub') { for (let i = N; i <= 89; i++) nums.push(i); }
  else { for (let i = N; i <= 89; i++) nums.push(i); }
  function round() {
    const vals = selectDispersed(rng, nums, 18);
    return vals.map(n => {
      const doAdd = op === 'add' ? true : (op === 'sub' ? false : rng() < 0.5);
      return doAdd
        ? { prefix: n + ' + ' + N + ' = ', suffix: '', answer: String(n + N) }
        : { prefix: n + ' \u2212 ' + N + ' = ', suffix: '', answer: String(n - N) };
    });
  }
  return [round(), round(), round()];
}

function genBlocUnique(N, seed, op) {
  const rng = mulberry32(seed);
  const nums = [];
  if (op === 'add') { for (let i = 0; i <= 90 - N; i++) nums.push(i); }
  else if (op === 'sub') { for (let i = N; i <= 90; i++) nums.push(i); }
  else { for (let i = N; i <= 90; i++) nums.push(i); }
  const vals = selectDispersed(rng, nums, 40);
  return vals.map(n => {
    const doAdd = op === 'add' ? true : (op === 'sub' ? false : rng() < 0.5);
    return doAdd
      ? { prefix: n + ' + ' + N + ' = ', suffix: '', answer: String(n + N) }
      : { prefix: n + ' \u2212 ' + N + ' = ', suffix: '', answer: String(n - N) };
  });
}

// ---------- moitiés (04/11) : nombres pairs jusqu'à N ; mélange doubles et moitiés (double de 1 à N, moitié des pairs jusqu'à 2N) ----------
function evensTo(N) { const p = []; for (let i = 2; i <= Math.max(2, N); i += 2) p.push(i); return p; }
const itMoitie = n => ({ prefix: 'moitié de ' + n + ' = ', suffix: '', answer: String(n / 2) });
const itDouble = n => ({ prefix: 'double de ' + n + ' = ', suffix: '', answer: String(2 * n) });
function genMoitiesBloc(N, seed) { return selectDispersed(mulberry32(seed), evensTo(N), 40).map(itMoitie); }
function genDefiVitesseMoities(N, seed) { const rng = mulberry32(seed); return [0, 1, 2].map(() => selectDispersed(rng, evensTo(N), 18).map(itMoitie)); }
function genDoublesMoities(N, seed) {   // un double et la moitié associée ne sont jamais voisins
  const rng = mulberry32(seed), ns = []; for (let i = 1; i <= Math.max(1, N); i++) ns.push(i);
  const d = selectDispersed(rng, ns, 20), m = selectDispersed(rng, ns, 20), out = [];
  let best = 0, bestBad = 99;   // décalage qui évite qu'un double soit voisin de sa moitié
  for (let k = 0; k < 20; k++) { let bad = 0; for (let i = 0; i < 20; i++) { const mm = m[(i + k) % 20]; if (mm === d[i] || (i < 19 && mm === d[i + 1])) bad++; } if (bad < bestBad) { bestBad = bad; best = k; } if (!bad) break; }
  for (let i = 0; i < 20; i++) { out.push(itDouble(d[i])); out.push(itMoitie(2 * m[(i + best) % 20])); }
  return out;
}
function genDoublesBloc(N, seed) {
  const rng = mulberry32(seed);
  const nums = [];
  for (let i = 0; i <= N; i++) nums.push(i);
  const vals = selectDispersed(rng, nums, 40);
  return vals.map(n => ({ prefix: n + ' + ' + n + ' = ', suffix: '', answer: String(n * 2) }));
}

function genPresqueDoublesBloc(N, seed) {

}

function niveauAcquisition(correct, total) {
  if (total === 0) return { label: '', cls: '' };
  const pct = correct / total;
  if (pct >= 0.95) return { label: 'Acquis', cls: 'niv-acquis' };
  if (pct >= 0.50) return { label: "En cours d'acquisition", cls: 'niv-encours' };
  return { label: 'Non acquis', cls: 'niv-non' };
}
function niveauFluence(correct, total) {
  if (total === 0) return { label: '', cls: '' };
  const pct = correct / total;
  if (pct >= 0.90) return { label: 'Automatis\u00e9', cls: 'niv-acquis' };
  if (pct >= 0.45) return { label: "En cours d'automatisation", cls: 'niv-encours' };
  return { label: 'Non automatis\u00e9', cls: 'niv-non' };
}
function verifySection(idx) {
  if (!lastGridData || lastGridData.showCorrige) return;
  const inputs = document.querySelectorAll('#sheet input.ans[data-section="' + idx + '"]');
  let correct = 0, total = 0;
  inputs.forEach(inp => {
    total++;
    const val = inp.value.trim();
    inp.classList.remove('correct', 'wrong');
    if (val === '') return;
    if (val === inp.dataset.answer) {
      inp.classList.add('correct');
      correct++;
    } else {
      inp.classList.add('wrong');
    }
  });
  const scoreEl = document.getElementById('score_' + idx);
  if (!scoreEl) return;
  const niv = niveauAcquisition(correct, total);
  let html = correct + ' / ' + total + (niv.label ? ' \u2014 <span class="' + niv.cls + '">' + niv.label + '</span>' : '');

  const t = sectionTimers[idx];
  if (t && t.elapsed > 0) {
    if (!t.overtime) {
      const fl = niveauFluence(correct, total);
      html += ' <span class="niv-fluence-tag">| fluence : <span class="' + fl.cls + '">' + fl.label + '</span></span>';
    } else {
      html += ' <span class="niv-fluence-tag">| fluence non mesur\u00e9e (temps d\u00e9pass\u00e9)</span>';
    }
  }
  scoreEl.innerHTML = html;
}

function pdfSafe(s) { return String(s).replace(/\s*\u2192\s*/g, ' : ').replace(/\u2212/g, '-').replace(/[\u2018\u2019]/g, "'").replace(/\u202f|\u00a0/g, ' '); }   // polices standard du PDF : pas de flèche ni de signe moins typographique
function drawPdfFromData(gridData) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' }); { const _t = doc.text.bind(doc); doc.text = (t, ...a) => _t(Array.isArray(t) ? t.map(pdfSafe) : pdfSafe(t), ...a); }
  const marginX = 8;
  let y = 10;
  const pageWidth = 210;
  const contentWidth = pageWidth - marginX * 2;

  doc.setDrawColor(0);
  doc.setLineWidth(0.3);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.rect(marginX, y, contentWidth / 2, 9);
  doc.rect(marginX + contentWidth / 2, y, contentWidth / 2, 9);
  doc.text('Pr\u00e9nom :', marginX + 2, y + 6);
  doc.text('Date :', marginX + contentWidth / 2 + 2, y + 6);
  y += 9;
  doc.rect(marginX, y, contentWidth, 8);
  doc.setFontSize(14);
  doc.text('CALCUL MENTAL', pageWidth / 2, y + 5.5, { align: 'center' });
  y += 8 + 5;

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.text('Fiche n° ' + gridData.code, pageWidth - marginX, y - 1.5, { align: 'right' });
  doc.setFontSize(10);
  doc.text((gridData.showCorrige ? 'CORRIGÉ — ' : '') + gridData.objectifText, pageWidth / 2, y + 2, { align: 'center' });
  y += 6;

  gridData.sections.forEach((section) => {
    if (section.title || gridData.chrono) {
      y += 3;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.text((section.title || 'Temps') + (gridData.chrono ? ' (' + formatTemps(section.duration) + ')' : ''), pageWidth / 2, y, { align: 'center' });
      y += 5.5;
    }
    const cols = section.cols;
    const cellW = contentWidth / cols;
    const cellH = 10.5;
    const rows = Math.ceil(section.items.length / cols);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10.5);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c;
        const it = section.items[idx];
        const x = marginX + c * cellW;
        doc.rect(x, y, cellW, cellH);
        if (it) {
          const txt = gridData.showCorrige ? (it.prefix + it.answer + it.suffix) : (it.prefix + '____' + it.suffix);
          doc.text(txt, x + cellW / 2, y + cellH / 2 + 1.5, { align: 'center' });
        }
      }
      y += cellH;
    }
    y += 3;
  });

  return doc;
}

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  const target = e.target;
  if (!target || !target.matches || !target.matches('input.ans')) return;
  e.preventDefault();
  const inputs = Array.from(document.querySelectorAll('#sheet input.ans'));
  const idx = inputs.indexOf(target);
  if (idx >= 0 && idx < inputs.length - 1) {
    inputs[idx + 1].focus();
    inputs[idx + 1].select();
  }
});
